<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Vehículos</title>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body>

<h:form id="msgsForm">
    <p:messages id="msgs" closable="true" />
</h:form>

<p:confirmDialog global="true" modal="true">
    <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
</p:confirmDialog>

<h:form id="menuForm">
    <p:menubar>
        <p:menuitem value="Inicio" icon="pi pi-home" url="index.html"/>
        <f:facet name="options">
            <p:commandButton value="Agregar nuevo" icon="pi pi-plus" type="button" onclick="PF('newVehiculoPanel').toggle()"/>
        </f:facet>
    </p:menubar>
</h:form>

<h:form id="newForm">
    <p:panel header="Nuevo Vehículo" widgetVar="newVehiculoPanel" toggleable="true" collapsed="true">
        <h:panelGrid columns="2">
            <h:outputLabel for="cliente" value="Cliente (id):" />
            <p:inputText id="cliente" value="#{vehiculoView.newIdCliente}" required="true"/>
            <h:outputLabel for="placas" value="Placas:" />
            <p:inputText id="placas" value="#{vehiculoView.newPlacas}" required="true"/>
            <h:outputLabel for="color" value="Color:" />
            <p:inputText id="color" value="#{vehiculoView.newColor}"/>
            <h:outputLabel for="modelo" value="Modelo:" />
            <p:inputText id="modelo" value="#{vehiculoView.newModelo}"/>
            <h:outputLabel for="marca" value="Marca:" />
            <p:inputText id="marca" value="#{vehiculoView.newMarca}"/>
            <h:outputLabel for="ano" value="Año:" />
            <p:inputText id="ano" value="#{vehiculoView.newAno}"/>
        </h:panelGrid>
        <p:separator/>
        <p:commandButton value="Agregar" actionListener="#{vehiculoView.add}" update=":vehiculosForm:tabla :msgsForm:msgs :newForm"/>
    </p:panel>
</h:form>

<h:form id="vehiculosForm">
    <p:dataTable id="tabla" value="#{vehiculoView.vehiculos}" var="v" paginator="true" rows="10" rowKey="#{v.id_vehiculo}">
        <p:column headerText="ID"><h:outputText value="#{v.id_vehiculo}"/></p:column>
        <p:column headerText="Cliente"><h:outputText value="#{v.idCliente}"/></p:column>
        <p:column headerText="Placas"><h:outputText value="#{v.licensePlate}"/></p:column>
        <p:column headerText="Color"><h:outputText value="#{v.color}"/></p:column>
        <p:column headerText="Modelo"><h:outputText value="#{v.model}"/></p:column>
        <p:column headerText="Marca"><h:outputText value="#{v.marca}"/></p:column>
        <p:column headerText="Año"><h:outputText value="#{v.year}"/></p:column>
        <p:column headerText="Acciones">
            <p:commandButton value="Editar" actionListener="#{vehiculoView.startEdit(v)}" update=":editContainer"/>
            <p:commandButton value="Eliminar" actionListener="#{vehiculoView.delete(v)}" update=":vehiculosForm:tabla :msgsForm:msgs">
                <p:confirm header="Confirmar" message="¿Eliminar vehículo?" />
            </p:commandButton>
        </p:column>
    </p:dataTable>
</h:form>

<h:panelGroup id="editContainer">
    <h:form id="editForm" rendered="#{not empty vehiculoView.selected}">
        <p:panel header="Editar Vehículo">
            <h:panelGrid columns="2">
                <h:outputLabel for="eplacas" value="Placas:" />
                <p:inputText id="eplacas" value="#{vehiculoView.editPlacas}"/>
                <h:outputLabel for="ecolor" value="Color:" />
                <p:inputText id="ecolor" value="#{vehiculoView.editColor}"/>
                <h:outputLabel for="emodelo" value="Modelo:" />
                <p:inputText id="emodelo" value="#{vehiculoView.editModelo}"/>
                <h:outputLabel for="emarca" value="Marca:" />
                <p:inputText id="emarca" value="#{vehiculoView.editMarca}"/>
                <h:outputLabel for="eano" value="Año:" />
                <p:inputText id="eano" value="#{vehiculoView.editAno}"/>
            </h:panelGrid>
            <p:separator/>
            <p:commandButton value="Guardar" actionListener="#{vehiculoView.saveEdit}" update=":vehiculosForm:tabla :msgsForm:msgs :editContainer"/>
        </p:panel>
    </h:form>
</h:panelGroup>

</h:body>
</html>
